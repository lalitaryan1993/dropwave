<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0d14" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="icon" href="favicon.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="manifest" href="manifest.webmanifest" />
<title>DropWave</title>
<style>
  :root {
    --bg:#f5f6fa; --panel:#ffffffd9; --raised:#fff; --line:rgba(20,24,40,.09); --line2:rgba(20,24,40,.16);
    --fg:#151827; --muted:#5f6478; --faint:#8a8fa3; --accent:#6d5dfc; --accent2:#19b5d8; --good:#12a36b; --bad:#e5484d;
    --glow:rgba(109,93,252,.28); --a1:rgba(109,93,252,.16); --a2:rgba(25,181,216,.14);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0b0d14; --panel:#161a27cc; --raised:#1b2031; --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.14);
      --fg:#e8eaf3; --muted:#a0a6bd; --faint:#6e7590; --accent:#8b7dff; --accent2:#2cc8ea; --good:#3ddc97; --bad:#ff6369;
      --glow:rgba(139,125,255,.35); --a1:rgba(139,125,255,.18); --a2:rgba(44,200,234,.1); }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; min-height:100%; }
  body {
    font-family: "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; color:var(--fg); font-size:15px;
    background: radial-gradient(700px 420px at 100% -10%, var(--a1), transparent 60%), radial-gradient(600px 420px at -10% 110%, var(--a2), transparent 60%), var(--bg);
    background-attachment: fixed; -webkit-font-smoothing:antialiased;
  }
  button, input { font:inherit; color:inherit; }
  button { cursor:pointer; border:0; background:none; }
  :focus-visible { outline:3px solid var(--accent); outline-offset:3px; border-radius:14px; }
  .wrap { max-width:620px; margin:0 auto; padding: max(18px, env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom)); }
  .grad { background:linear-gradient(120deg,var(--accent),var(--accent2)); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:22px; backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); }
  .muted { color:var(--muted); } .faint { color:var(--faint); }
  .row { display:flex; align-items:center; gap:12px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; height:46px; padding:0 18px; border-radius:14px; font-weight:600; font-size:15px; transition:transform .12s, filter .15s; }
  .btn:active { transform:scale(.97); }
  .btn.primary { color:#fff; background:linear-gradient(120deg,var(--accent),var(--accent2)); box-shadow:0 10px 26px -10px var(--glow); }
  .btn.soft { background:var(--raised); border:1px solid var(--line2); color:var(--fg); }
  a.btn { text-decoration:none; color:var(--fg); }
  a.btn.ok { color:var(--good); border-color:color-mix(in oklab, var(--good) 40%, var(--line)); }
  .ellipsis { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .btn.ghost { color:var(--muted); }
  .btn.small { height:36px; padding:0 12px; font-size:13.5px; border-radius:11px; }
  .btn[disabled] { opacity:.5; pointer-events:none; }
  svg.i { width:20px; height:20px; flex:none; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .hidden { display:none !important; }

  header { display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  header img { width:34px; height:34px; border-radius:10px; }
  header .t { font-weight:700; font-size:17px; letter-spacing:-.01em; }
  .pill { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; padding:5px 10px; border-radius:999px; background:var(--raised); border:1px solid var(--line); }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--good); box-shadow:0 0 8px var(--good); }
  .dot.off { background:var(--bad); box-shadow:none; }

  /* lock */
  .lock { min-height:80vh; display:grid; place-items:center; text-align:center; }
  .lock img { width:84px; height:84px; border-radius:24px; box-shadow:0 20px 50px -18px var(--glow); }
  .lock h1 { font-size:24px; margin:18px 0 6px; letter-spacing:-.02em; }
  .pin { width:100%; max-width:300px; height:62px; margin:22px auto 0; display:block; text-align:center; font-size:30px; letter-spacing:.45em; padding-left:.45em;
    border-radius:18px; border:1px solid var(--line2); background:var(--raised); outline:none; font-variant-numeric:tabular-nums; }
  .pin:focus { border-color:var(--accent); box-shadow:0 0 0 5px var(--glow); }
  .err { color:var(--bad); font-size:13.5px; min-height:20px; margin-top:10px; }

  /* send */
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--faint); margin:26px 4px 10px; font-weight:700; }
  .targets { display:flex; gap:10px; overflow-x:auto; padding:2px 2px 6px; scrollbar-width:none; }
  .target { flex:none; display:flex; align-items:center; gap:10px; padding:8px 14px 8px 8px; border-radius:16px; border:1px solid var(--line); background:var(--raised); font-weight:600; font-size:14px; transition:all .15s; }
  .target .av { width:34px; height:34px; border-radius:50%; display:grid; place-items:center; color:#fff; }
  .target.on { border-color:var(--accent); box-shadow:0 0 0 3px var(--glow); }
  .drop { margin-top:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:10px; padding:34px 20px; border-radius:22px;
    border:2px dashed var(--line2); background:var(--panel); transition:all .2s; width:100%; }
  .drop.over { border-color:var(--accent); background:color-mix(in oklab, var(--accent) 10%, var(--panel)); transform:scale(1.01); }
  .drop .big { width:62px; height:62px; border-radius:20px; display:grid; place-items:center; color:#fff; box-shadow:0 14px 34px -12px var(--glow); }
  .drop .big svg { width:30px; height:30px; }
  .drop b { font-size:17px; }

  /* lists */
  .list { display:flex; flex-direction:column; gap:10px; }
  .item { padding:14px; border-radius:18px; background:var(--raised); border:1px solid var(--line); }
  .item .name { font-weight:600; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item .sub { font-size:12.5px; color:var(--faint); margin-top:2px; }
  .bar { height:6px; border-radius:6px; background:var(--line); overflow:hidden; margin-top:10px; }
  .bar > i { display:block; height:100%; width:0; border-radius:6px; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .2s linear; }
  .ok { color:var(--good); } .bad { color:var(--bad); }
  .thumb { width:46px; height:46px; border-radius:12px; flex:none; display:grid; place-items:center; background:var(--line); overflow:hidden; color:var(--muted); }
  .thumb img { width:100%; height:100%; object-fit:cover; }
  .offer { padding:16px; border-radius:22px; border:1px solid color-mix(in oklab, var(--accent) 45%, var(--line)); background:var(--panel); box-shadow:0 18px 40px -24px var(--glow); }
  .offer .files { margin:12px 0; display:flex; flex-direction:column; gap:8px; max-height:340px; overflow:auto; }
  .frow { display:flex; align-items:center; gap:12px; }
  .frow .meta { flex:1; min-width:0; }
  .empty { text-align:center; padding:26px 10px; color:var(--faint); font-size:13.5px; }
  .textbox { margin-top:12px; display:flex; gap:10px; align-items:flex-end; padding:10px; border-radius:18px; background:var(--panel); border:1px solid var(--line); }
  .textbox textarea { flex:1; resize:none; border:0; outline:none; background:transparent; font:inherit; color:inherit; padding:8px 6px; max-height:140px; }
  .thread { display:flex; flex-direction:column; gap:8px; max-height:380px; overflow-y:auto; padding:4px 2px; }
  .thread .none { text-align:center; color:var(--faint); font-size:13px; padding:14px 0; }
  .bub { max-width:82%; padding:9px 13px; border-radius:18px; font-size:14.5px; line-height:1.45; white-space:pre-wrap; word-break:break-word; user-select:text; -webkit-user-select:text; }
  .bub.in { align-self:flex-start; background:var(--raised); border:1px solid var(--line); border-bottom-left-radius:6px; }
  .bub.out { align-self:flex-end; color:#fff; background:linear-gradient(120deg,var(--accent),var(--accent2)); border-bottom-right-radius:6px; }
  .bub a { color:inherit; text-decoration:underline; }
  .bub .meta { display:flex; justify-content:flex-end; gap:8px; align-items:center; font-size:11px; opacity:.75; margin-top:3px; }
  .bub .meta button { font-size:11px; padding:0; text-decoration:underline; color:inherit; }
  .badge { min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--accent); color:#fff; font-size:11px; display:inline-grid; place-items:center; }
  .msg { white-space:pre-wrap; word-break:break-word; background:var(--raised); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin:12px 0; font-size:14.5px; max-height:220px; overflow:auto; user-select:text; -webkit-user-select:text; }

  /* viewer (TV friendly) */
  .viewer { position:fixed; inset:0; z-index:50; background:#000; display:grid; place-items:center; }
  .viewer video, .viewer img, .viewer audio { max-width:100vw; max-height:100vh; }
  .viewer .close { position:fixed; top:max(14px, env(safe-area-inset-top)); right:14px; background:rgba(255,255,255,.15); color:#fff; width:46px; height:46px; border-radius:50%; display:grid; place-items:center; }

  /* calls & screen sharing */
  .callrow { display:flex; gap:8px; margin:-4px 0 14px; }
  .callrow .btn { flex:1; height:40px; font-size:13.5px; padding:0 10px; }
  .call { position:fixed; inset:0; z-index:55; background:#05060a; color:#fff; display:flex; flex-direction:column; }
  .call video { background:#000; }
  .call #cRemote { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  .call #cLocal { position:absolute; right:14px; top:calc(70px + env(safe-area-inset-top)); width:30vw; max-width:180px; aspect-ratio:3/4; object-fit:cover; border-radius:16px; border:1px solid rgba(255,255,255,.25); transform:scaleX(-1); z-index:2; }
  .call .ctop { position:relative; z-index:2; padding:calc(16px + env(safe-area-inset-top)) 18px 26px; background:linear-gradient(#000a,#0000); }
  .call .ctop b { font-size:17px; display:block; }
  .call .ctop span { font-size:13px; color:#fffb; }
  .call .cmid { flex:1; display:grid; place-items:center; position:relative; z-index:1; text-align:center; }
  .call .cav { width:96px; height:96px; border-radius:50%; display:grid; place-items:center; font-size:34px; font-weight:800; margin:0 auto 14px; background:linear-gradient(140deg,var(--accent),var(--accent2)); }
  .call .cav.pulse { animation:cpulse 1.4s ease-in-out infinite; }
  @keyframes cpulse { 50% { box-shadow:0 0 0 18px rgba(139,125,255,.18); } }
  .call .cbar { position:relative; z-index:2; display:flex; justify-content:center; gap:22px; padding:28px 18px calc(30px + env(safe-area-inset-bottom)); background:linear-gradient(#0000,#000b); }
  .cbtn { width:62px; height:62px; border-radius:50%; display:grid; place-items:center; background:rgba(255,255,255,.16); color:#fff; }
  .cbtn.on { background:#fff; color:#111; }
  .cbtn.red { background:#e5484d; }
  .cbtn.green { background:#12a36b; }
  .cbtn svg { width:26px; height:26px; }
  .clabel { font-size:12px; color:#fffb; margin-top:6px; text-align:center; }

  .toast { position:fixed; left:50%; bottom:calc(22px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:var(--raised); border:1px solid var(--line2); padding:11px 16px; border-radius:14px; box-shadow:0 14px 40px rgba(0,0,0,.25); font-size:14px; z-index:60; }
  @media (min-width: 900px) { .wrap { max-width:760px; } body { font-size:16px; } }
</style>
</head>
<body>
<div class="wrap">
  <!-- Locked -->
  <section id="lock" class="lock hidden">
    <form id="pinForm" style="width:100%">
      <img src="icon-192.png" alt="" />
      <h1>Connect to <span id="pcName1">your PC</span></h1>
      <div class="muted">Enter the 6-digit PIN shown in DropWave on the PC<br/>(Nearby → Phone or TV)</div>
      <input id="pin" class="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" aria-label="PIN" />
      <div id="pinErr" class="err"></div>
      <button class="btn primary" style="width:100%;max-width:300px;margin-top:6px" type="submit">Connect</button>
    </form>
  </section>

  <!-- Main -->
  <section id="app" class="hidden">
    <header>
      <img src="icon-192.png" alt="" />
      <div style="flex:1;min-width:0">
        <div class="t">DropWave</div>
        <div class="faint" style="font-size:12.5px"><span id="conn" class="row" style="gap:6px;display:flex;min-width:0"><span class="dot" style="flex:none"></span><span id="connText" class="ellipsis">Connected</span></span></div>
      </div>
      <button id="switchBtn" class="pill hidden" style="flex:none" title="Connect to a different PC">PCs</button>
      <button id="meBtn" class="pill" style="flex:none;max-width:45%" title="Rename this device"><span id="meName" class="ellipsis">This device</span>
        <svg class="i" style="width:14px;height:14px" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
    </header>

    <div id="offers" class="list"></div>

    <h2>Send to</h2>
    <div id="targets" class="targets"></div>
    <div id="callRow" class="callrow hidden">
      <button class="btn soft" id="callAudio"><svg class="i" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"/></svg>Call</button>
      <button class="btn soft" id="callVideo"><svg class="i" viewBox="0 0 24 24"><path d="m22 8-6 4 6 4V8Z"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>Video</button>
      <button class="btn soft" id="callScreen"><svg class="i" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>View screen</button>
    </div>
    <label id="drop" class="drop" tabindex="0">
      <div class="big grad"><svg class="i" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg></div>
      <b>Choose files to send</b>
      <span class="muted" style="font-size:13.5px">Photos, videos, documents — any size</span>
      <input id="file" type="file" multiple class="hidden" />
    </label>
    <h2 id="chatTitle">Chat</h2>
    <div id="thread" class="thread"></div>
    <form id="textForm" class="textbox">
      <textarea id="textIn" rows="1" placeholder="Message or link…" aria-label="Message"></textarea>
      <button class="btn primary small" type="submit" aria-label="Send message">Send</button>
    </form>

    <h2 id="actTitle" class="hidden">Activity</h2>
    <div id="activity" class="list"></div>
  </section>
</div>

<div id="call" class="call hidden">
  <video id="cRemote" autoplay playsinline class="hidden"></video>
  <video id="cLocal" autoplay playsinline muted class="hidden"></video>
  <div class="ctop"><b id="cName"></b><span id="cStatus"></span></div>
  <div class="cmid"><div id="cWho"><div id="cAv" class="cav"></div><div id="cDesc" style="font-size:15px;color:#fffc"></div></div></div>
  <div id="cRing" class="cbar hidden">
    <div><button class="cbtn red" id="cDecline" aria-label="Decline"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button><div class="clabel">Decline</div></div>
    <div><button class="cbtn green" id="cAccept" aria-label="Accept"><svg class="i" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></button><div class="clabel" id="cAcceptLabel">Accept</div></div>
  </div>
  <div id="cBar" class="cbar hidden">
    <button class="cbtn" id="cMute" aria-label="Mute"><svg class="i" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1M12 18v4"/></svg></button>
    <button class="cbtn" id="cCam" aria-label="Camera"><svg class="i" viewBox="0 0 24 24"><path d="m22 8-6 4 6 4V8Z"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg></button>
    <button class="cbtn red" id="cEnd" aria-label="End"><svg class="i" viewBox="0 0 24 24"><path d="M10.7 13.3a16 16 0 0 0 3.4 2.6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7M22 2 2 22"/></svg></button>
  </div>
</div>

<div id="viewer" class="viewer hidden">
  <button class="close" id="vClose" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  <div id="vBody"></div>
</div>

<script src="rtc.js"></script>
<script>
(() => {
  // Inside the DropWave Android app, window.DW_APP = { base, key, download(url, name), saveKey(key),
  // logout(), sharedFiles, sharedText, minimize() }. In a phone/TV browser it's undefined and the page
  // talks to the server it was loaded from, authenticated by cookie.
  const APP = window.DW_APP || null;
  const BASE = APP ? APP.base : '';
  const withKey = (u) => (APP ? `${BASE}${u}${u.includes('?') ? '&' : '?'}key=${APP.key}` : u);
  const api = (path, opts = {}) => fetch(BASE + path, { ...opts, headers: { ...(opts.headers || {}), ...(APP ? { 'X-DropWave-Key': APP.key } : {}) } });
  const $ = (s) => document.querySelector(s);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const fmt = (b) => { const u=['B','KB','MB','GB','TB']; let i=0; while (b>=1024&&i<u.length-1){b/=1024;i++;} return `${b.toFixed(b<10&&i?1:0)} ${u[i]}`; };
  const hue = (id='') => { let h=0; for (const c of id) h=(h*31+c.charCodeAt(0))>>>0; return h%360; };
  const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} } };

  const ICON = {
    computer: '<path d="M4 5h16v11H4zM8 20h8M12 16v4"/>',
    phone: '<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/>',
    tablet: '<rect x="4.5" y="2.5" width="15" height="19" rx="2.5"/><path d="M11 18.5h2"/>',
    tv: '<rect x="2.5" y="5" width="19" height="12" rx="2"/><path d="M8 21h8M12 17v4"/>',
    file: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
    play: '<path d="M7 4v16l13-8z"/>',
    down: '<path d="M12 4v12M7 11l5 5 5-5M5 20h14"/>',
    check: '<path d="M5 12l5 5 9-10"/>',
    x: '<path d="M18 6 6 18M6 6l12 12"/>',
  };
  const svg = (name, extra='') => `<svg class="i" ${extra} viewBox="0 0 24 24">${ICON[name]}</svg>`;

  let myId = store.get('ld_id');
  if (!myId) { myId = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()); store.set('ld_id', myId); }
  let pc = null, peers = [], target = null, es = null;
  const uploads = new Map();

  function toast(text) {
    const t = el('div', 'toast', esc(text));
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3200);
  }
  window.dwToast = toast; // used by the Android app bridge

  async function boot() {
    const r = await api('/api/hello').then((x) => x.json()).catch(() => null);
    if (!r) { $('#lock').classList.remove('hidden'); $('#pinErr').textContent = 'Can’t reach the PC. Is DropWave open?'; return; }
    pc = r.pc;
    document.title = `DropWave · ${pc.name}`;
    $('#pcName1').textContent = pc.name;
    if (!r.authed) { $('#lock').classList.remove('hidden'); $('#app').classList.add('hidden'); $('#pin').focus(); return; }
    $('#lock').classList.add('hidden');
    $('#app').classList.remove('hidden');
    connect();
  }

  $('#pin').addEventListener('input', (e) => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6); if (e.target.value.length === 6) $('#pinForm').requestSubmit(); });
  $('#pinForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('#pinErr').textContent = '';
    const r = await api('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin: $('#pin').value }) });
    if (r.ok) {
      if (APP) APP.saveKey((await r.json()).key); // the app keeps the key instead of a cookie
      return boot();
    }
    $('#pinErr').textContent = (await r.json().catch(() => ({}))).error || 'Could not connect';
    $('#pin').value = ''; $('#pin').focus();
  });

  function connect() {
    if (es) es.close();
    const name = store.get('ld_name') || '';
    es = new EventSource(withKey(`/api/events?id=${encodeURIComponent(myId)}&name=${encodeURIComponent(name)}`));
    es.addEventListener('hello', (m) => {
      const d = JSON.parse(m.data);
      $('#meName').textContent = d.you.name;
      setConn(true);
      APP?.connected?.(d.pc?.name || pc.name);
    });
    es.addEventListener('peers', (m) => { peers = JSON.parse(m.data); renderTargets(); });
    es.addEventListener('offer', (m) => addOffer(JSON.parse(m.data)));
    es.addEventListener('text', (m) => addText(JSON.parse(m.data)));
    es.addEventListener('rtc', (m) => onRtc(JSON.parse(m.data)));
    es.addEventListener('offer-closed', (m) => { const id = JSON.parse(m.data).id; document.getElementById('o-' + id)?.remove(); APP?.clearNotify?.('o-' + id); toast('The sender cancelled'); });
    es.onerror = () => {
      setConn(false);
      // A locked response (PIN changed) also lands here: re-check.
      api('/api/hello').then((x) => x.json()).then((r) => { if (!r.authed) { es.close(); boot(); } }).catch(() => {});
    };
  }

  function setConn(on) {
    $('#conn .dot').classList.toggle('off', !on);
    $('#connText').textContent = on ? `${APP?.secure ? '🔒 ' : ''}Connected to ${pc.name}` : 'Reconnecting…';
  }

  if (APP) { $('#switchBtn').classList.remove('hidden'); $('#switchBtn').addEventListener('click', () => APP.switchPC()); }

  $('#meBtn').addEventListener('click', async () => {
    const n = prompt('Name this device', $('#meName').textContent);
    if (!n || !n.trim()) return;
    store.set('ld_name', n.trim());
    $('#meName').textContent = n.trim();
    await api('/api/rename', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: myId, name: n.trim() }) });
  });

  // ---------- targets ----------
  function renderTargets() {
    const before = target;
    if (!target || !peers.some((p) => p.id === target)) target = peers[0]?.id;
    const box = $('#targets');
    box.innerHTML = '';
    for (const p of peers) {
      const h = hue(p.id);
      const n = unread.get(p.id) || 0;
      const b = el('button', 'target' + (p.id === target ? ' on' : ''),
        `<span class="av" style="background:linear-gradient(140deg,hsl(${h} 80% 62%),hsl(${(h+50)%360} 85% 52%))">${svg(p.kind in ICON ? p.kind : 'computer', 'style="width:18px;height:18px"')}</span>${esc(p.name)}${n ? ` <span class="badge">${n}</span>` : ''}`);
      b.addEventListener('click', () => { target = p.id; renderTargets(); renderThread(); });
      box.appendChild(b);
    }
    if (target !== before) renderThread();
    updateCallRow();
  }

  // ---------- sending ----------
  const drop = $('#drop');
  $('#file').addEventListener('change', (e) => { if (e.target.files.length) send([...e.target.files]); e.target.value = ''; });
  drop.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('#file').click(); } });
  ['dragenter', 'dragover'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach((t) => drop.addEventListener(t, () => drop.classList.remove('over')));
  drop.addEventListener('drop', (e) => { e.preventDefault(); if (e.dataTransfer.files.length) send([...e.dataTransfer.files]); });

  async function send(files) {
    const to = peers.find((p) => p.id === target) || peers[0];
    if (!to) return toast('No device to send to');
    const list = files.map((f) => ({ name: f.webkitRelativePath || f.name, size: f.size }));
    const total = files.reduce((a, f) => a + f.size, 0);
    const label = files.length === 1 ? files[0].name : `${files.length} files`;
    // A PC asks its user first, so show that we're waiting.
    const row = activityRow('pending', `↑ ${label}`, to.pc ? `Waiting for ${to.name} to accept…` : `to ${to.name} · ${fmt(total)}`, false);
    const r = await api('/api/batch', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ from: myId, to: to.id, files: list }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) return finishRow(row, false, j.error || 'Could not start the transfer');
    row.querySelector('.row').insertAdjacentHTML('beforeend', `<button class="btn ghost small" data-cancel aria-label="Cancel">${svg('x')}</button>`);
    row.querySelector('[data-sub]').textContent = `to ${to.name} · ${fmt(total)}`;
    const u = { id: j.id, xhr: null, cancelled: false };
    uploads.set(j.id, u);
    row.querySelector('[data-cancel]').onclick = () => { u.cancelled = true; u.xhr?.abort(); api('/api/cancel', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: j.id }) }); };

    let done = 0;
    const t0 = Date.now();
    try {
      for (let i = 0; i < files.length; i++) {
        await new Promise((resolve, reject) => {
          const x = new XMLHttpRequest();
          u.xhr = x;
          x.open('POST', BASE + `/api/upload?batch=${j.id}&i=${i}`);
          if (APP) x.setRequestHeader('X-DropWave-Key', APP.key);
          x.upload.onprogress = (e) => {
            const cur = done + e.loaded;
            const secs = (Date.now() - t0) / 1000;
            setProgress(row, cur / total, `${fmt(cur)} of ${fmt(total)} · ${fmt(cur / Math.max(secs, .001))}/s`);
          };
          x.onload = () => (x.status === 200 ? resolve() : reject(new Error(JSON.parse(x.responseText || '{}').error || 'Upload failed')));
          x.onerror = () => reject(new Error('Connection lost'));
          x.onabort = () => reject(new Error('Cancelled'));
          x.send(files[i]);
        });
        done += files[i].size;
      }
      finishRow(row, true, `Sent to ${to.name} · ${fmt(total)}`);
    } catch (e) {
      finishRow(row, false, u.cancelled ? 'Cancelled' : e.message);
    } finally { uploads.delete(j.id); }
  }

  function activityRow(id, title, sub, cancellable) {
    $('#actTitle').classList.remove('hidden');
    const r = el('div', 'item', `
      <div class="row"><div style="flex:1;min-width:0"><div class="name">${esc(title)}</div><div class="sub" data-sub>${esc(sub)}</div></div>
      ${cancellable ? `<button class="btn ghost small" data-cancel aria-label="Cancel">${svg('x')}</button>` : ''}</div>
      <div class="bar"><i></i></div>`);
    $('#activity').prepend(r);
    return r;
  }
  function setProgress(row, f, text) { row.querySelector('.bar > i').style.width = `${Math.min(100, f * 100)}%`; row.querySelector('[data-sub]').textContent = text; }
  function finishRow(row, ok, text) {
    row.querySelector('.bar')?.remove();
    row.querySelector('[data-cancel]')?.remove();
    const s = row.querySelector('[data-sub]');
    s.innerHTML = `<span class="${ok ? 'ok' : 'bad'}">${ok ? '✓' : '✕'}</span> ${esc(text)}`;
  }

  // ---------- chat ----------
  // Conversations live on this phone (localStorage), one thread per device.
  const MSG_KEY = 'ld_msgs';
  let msgs = [];
  try { msgs = JSON.parse(store.get(MSG_KEY) || '[]'); } catch { msgs = []; }
  const unread = new Map();
  const saveMsgs = () => { msgs = msgs.slice(-400); store.set(MSG_KEY, JSON.stringify(msgs)); };
  const linkify = (s) => esc(s).replace(/(https?:\/\/[^\s<>"']+)/gi, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
  const hhmm = (ts) => new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

  function renderThread() {
    const to = peers.find((p) => p.id === target);
    $('#chatTitle').textContent = to ? `Chat with ${to.name}` : 'Chat';
    const box = $('#thread');
    const list = msgs.filter((m) => m.peer === target);
    box.innerHTML = list.length ? '' : `<div class="none">No messages with ${esc(to?.name || 'this device')} yet. Send a link or a note.</div>`;
    for (const m of list) {
      const b = el('div', `bub ${m.dir}`, `${linkify(m.text)}<div class="meta">${m.dir === 'in' ? '<button data-copy>Copy</button>' : ''}<span>${hhmm(m.at)}${m.dir === 'out' ? (m.status === 'failed' ? ' · not sent' : m.status === 'sending' ? ' · …' : ' ✓') : ''}</span></div>`);
      b.querySelector('[data-copy]')?.addEventListener('click', async (e) => { e.currentTarget.textContent = (await copyText(m.text)) ? 'Copied ✓' : 'Hold text to copy'; });
      box.appendChild(b);
    }
    box.scrollTop = box.scrollHeight;
    unread.delete(target);
  }

  const textIn = $('#textIn');
  textIn.addEventListener('input', () => { textIn.style.height = 'auto'; textIn.style.height = textIn.scrollHeight + 'px'; });
  $('#textForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = textIn.value.trim();
    const to = peers.find((p) => p.id === target) || peers[0];
    if (!text || !to) return;
    const m = { id: String(Date.now()) + Math.random().toString(36).slice(2, 6), peer: to.id, name: to.name, dir: 'out', text, at: Date.now(), status: 'sending' };
    msgs.push(m); saveMsgs(); renderThread();
    textIn.value = ''; textIn.style.height = 'auto';
    const r = await api('/api/text', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ from: myId, to: to.id, text }) }).catch(() => null);
    m.status = r && r.ok ? 'sent' : 'failed';
    if (m.status === 'failed') toast((r && (await r.json().catch(() => ({}))).error) || 'Could not send — check the connection');
    saveMsgs(); renderThread();
  });

  // Clipboard API needs HTTPS; on plain-HTTP LAN pages fall back to a hidden textarea + execCommand.
  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch {}
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    let ok = false; try { ok = document.execCommand('copy'); } catch {}
    ta.remove();
    return ok;
  }

  function addText(m) {
    if (msgs.some((x) => x.id === m.id)) return;
    msgs.push({ id: m.id, peer: m.from.id, name: m.from.name, dir: 'in', text: m.text, at: Date.now() });
    saveMsgs();
    if (m.from.id === target) renderThread();
    else {
      unread.set(m.from.id, (unread.get(m.from.id) || 0) + 1);
      renderTargets();
      toast(`💬 ${m.from.name}: ${m.text.length > 50 ? m.text.slice(0, 47) + '…' : m.text}`);
    }
    if (navigator.vibrate) navigator.vibrate(60);
    // One notification per sender; a newer message replaces the older one.
    APP?.notify?.({ id: 'm-' + m.from.id, kind: 'text', title: m.from.name, body: m.text.length > 300 ? m.text.slice(0, 297) + '…' : m.text });
  }

  // Download / Decline tapped on an Android notification (app may be in the background).
  window.dwNotifAction = async (id, action) => {
    const card = document.getElementById(id);
    const o = offers.get(id);
    if (!card || !o) return;
    if (action === 'decline') {
      await api('/api/decline', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: o.id }) }).catch(() => {});
      card.remove();
      return;
    }
    // Download every file straight away (no synthetic clicks: they're unreliable in the background).
    const rows = card.querySelectorAll('.frow');
    for (let i = 0; i < o.files.length; i++) {
      const f = o.files[i];
      if (APP) APP.download(withKey(f.url), f.name.split('/').pop());
      if (rows[i]) markDone(rows[i]);
      await new Promise((r) => setTimeout(r, 400));
    }
  };

  // ---------- receiving ----------
  const offers = new Map(); // 'o-<id>' -> offer, for the notification buttons
  function addOffer(o) {
    if (document.getElementById('o-' + o.id)) return;
    offers.set('o-' + o.id, o);
    const card = el('div', 'offer');
    card.id = 'o-' + o.id;
    const many = o.files.length > 1;
    card.innerHTML = `
      <div class="row"><div style="flex:1;min-width:0">
        <div style="font-weight:700;font-size:16px">${esc(o.from.name)} sent you ${many ? o.files.length + ' files' : 'a file'}</div>
        <div class="sub faint" style="font-size:13px">${fmt(o.total)}</div></div>
        <button class="btn ghost small" data-decline>Decline</button></div>
      <div class="files"></div>
      ${many ? `<button class="btn primary" style="width:100%" data-all>${svg('down')} Download all</button>` : ''}`;
    const list = card.querySelector('.files');
    o.files.forEach((f) => {
      const viewable = /^(image|video|audio)\//.test(f.type);
      const r = el('div', 'frow', `
        <div class="thumb">${f.type.startsWith('image/') ? `<img loading="lazy" src="${withKey(f.url + '?thumb')}" alt="">` : svg(f.type.startsWith('video/') ? 'play' : 'file')}</div>
        <div class="meta"><div class="name" style="font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.name.split('/').pop())}</div><div class="faint" style="font-size:12.5px">${fmt(f.size)}</div></div>
        ${viewable ? `<button class="btn soft small" data-view>${svg('play', 'style="width:16px;height:16px"')} Open</button>` : ''}
        <a class="btn soft small" href="${withKey(f.url)}" download data-dl aria-label="Download">${svg('down', 'style="width:16px;height:16px"')}</a>`);
      r.querySelector('[data-view]')?.addEventListener('click', () => view(f));
      r.querySelector('[data-dl]').addEventListener('click', (e) => {
        // In the app, save straight to Download/DropWave instead of the WebView's download.
        if (APP) { e.preventDefault(); APP.download(withKey(f.url), f.name.split('/').pop()); }
        markDone(r);
      });
      list.appendChild(r);
    });
    card.querySelector('[data-decline]').onclick = async () => {
      await api('/api/decline', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: o.id }) });
      card.remove();
    };
    card.querySelector('[data-all]')?.addEventListener('click', async () => {
      // Browsers allow one download per click on some phones, so space them out.
      for (const a of list.querySelectorAll('[data-dl]')) { a.click(); await new Promise((r) => setTimeout(r, 700)); }
    });
    $('#offers').prepend(card);
    if (navigator.vibrate) navigator.vibrate(60);
    toast(`${o.from.name} sent you ${many ? o.files.length + ' files' : 'a file'}`);
    const names = o.files.map((f) => f.name.split('/').pop());
    APP?.notify?.({
      id: 'o-' + o.id, kind: 'offer',
      title: `${o.from.name} sent you ${many ? o.files.length + ' files' : 'a file'}`,
      body: `${names.slice(0, 3).join(', ')}${names.length > 3 ? ` +${names.length - 3} more` : ''} · ${fmt(o.total)}`,
    });
  }
  function markDone(row) { const a = row.querySelector('[data-dl]'); a.innerHTML = svg('check', 'style="width:16px;height:16px"'); a.classList.add('ok'); }

  function view(f) {
    const body = $('#vBody');
    const src = withKey(f.url + '?view');
    body.innerHTML = f.type.startsWith('image/') ? `<img src="${src}" alt="">`
      : f.type.startsWith('video/') ? `<video src="${src}" controls autoplay playsinline></video>`
      : `<audio src="${src}" controls autoplay></audio>`;
    $('#viewer').classList.remove('hidden');
    $('#vClose').focus();
  }
  const closeViewer = () => { $('#viewer').classList.add('hidden'); $('#vBody').innerHTML = ''; };
  $('#vClose').addEventListener('click', closeViewer);
  document.addEventListener('keydown', (e) => { if ((e.key === 'Escape' || e.key === 'Backspace' || e.key === 'GoBack') && !$('#viewer').classList.contains('hidden')) { e.preventDefault(); closeViewer(); } });

  // ---------- calls & screen sharing (WebRTC; logic in rtc.js, shared with the PC) ----------
  const callDesc = (c) => c.media === 'screen'
    ? (c.role === 'callee' ? (c.share === 'callee' ? 'wants to see your screen' : 'wants to show you their screen') : (c.sharing ? 'Sharing your screen' : 'Screen'))
    : c.role === 'callee' ? (c.media === 'video' ? 'Video call' : 'Voice call') : (c.media === 'video' ? 'Video call' : 'Voice call');
  let ringBuzz = null, liveAt = 0, liveTimer = null;
  const calls = window.DWCalls ? window.DWCalls({
    send: async (peerId, msg) => {
      const r = await api('/api/rtc', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ from: myId, to: peerId, msg }) });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'Could not reach that device');
    },
    onChange: renderCall,
  }) : null;

  function renderCall(c) {
    const o = $('#call');
    clearInterval(ringBuzz); ringBuzz = null;
    if (!c) {
      o.classList.add('hidden'); clearInterval(liveTimer); liveTimer = null; liveAt = 0;
      $('#cRemote').srcObject = null; $('#cLocal').srcObject = null;
      return;
    }
    o.classList.remove('hidden');
    const ringing = c.status === 'ringing-in';
    if (ringing && navigator.vibrate) { navigator.vibrate([400, 300, 400]); ringBuzz = setInterval(() => navigator.vibrate([400, 300, 400]), 2000); }
    $('#cRing').classList.toggle('hidden', !ringing);
    $('#cBar').classList.toggle('hidden', ringing || c.status === 'ended');
    $('#cName').textContent = c.peer.name;
    $('#cDesc').textContent = callDesc(c);
    $('#cAv').textContent = (c.peer.name || '?').slice(0, 2).toUpperCase();
    $('#cAv').classList.toggle('pulse', c.status.startsWith('ringing'));
    const screenAsk = c.media === 'screen' && c.share === 'callee';
    $('#cAcceptLabel').textContent = ringing && screenAsk ? 'Share screen' : 'Accept';

    const rv = $('#cRemote');
    if (rv.srcObject !== (c.remote || null)) rv.srcObject = c.remote || null;
    const showsVideo = c.media === 'video' || (c.media === 'screen' && !c.sharing);
    rv.classList.toggle('hidden', !showsVideo || !c.remote);
    $('#cWho').classList.toggle('hidden', showsVideo && !!c.remote);
    const lv = $('#cLocal');
    const showLocal = c.media === 'video' && c.local && !c.camOff;
    if (showLocal && lv.srcObject !== c.local) lv.srcObject = c.local;
    lv.classList.toggle('hidden', !showLocal);

    const hasMic = !!c.local?.getAudioTracks().length;
    $('#cMute').classList.toggle('hidden', !hasMic);
    $('#cMute').classList.toggle('on', c.muted);
    $('#cCam').classList.toggle('hidden', c.media !== 'video' || !c.local);
    $('#cCam').classList.toggle('on', c.camOff);

    clearInterval(liveTimer); liveTimer = null;
    const status = () => {
      if (c.status === 'ended') return c.reason || 'Call ended';
      if (c.status === 'ringing-out') return 'Ringing…';
      if (c.status === 'connecting') return 'Connecting…';
      if (c.status === 'live') { const s = Math.floor((Date.now() - liveAt) / 1000); return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; }
      return '';
    };
    if (c.status === 'live') { if (!liveAt) liveAt = Date.now(); liveTimer = setInterval(() => { $('#cStatus').textContent = status(); }, 1000); }
    $('#cStatus').textContent = status();
  }

  async function startCall(media, share) {
    const to = peers.find((p) => p.id === target);
    if (!calls || !to) return;
    try { await calls.start({ id: to.id, name: to.name }, media, share); } catch (e) { toast(e.message || 'Could not start the call'); }
  }
  $('#callAudio').addEventListener('click', () => startCall('audio'));
  $('#callVideo').addEventListener('click', () => startCall('video'));
  $('#callScreen').addEventListener('click', () => startCall('screen', 'callee'));
  $('#cAccept').addEventListener('click', () => calls?.accept());
  $('#cDecline').addEventListener('click', () => calls?.decline());
  $('#cEnd').addEventListener('click', () => calls?.end());
  $('#cMute').addEventListener('click', () => calls?.toggleMute());
  $('#cCam').addEventListener('click', () => calls?.toggleCam());

  function updateCallRow() {
    const to = peers.find((p) => p.id === target);
    $('#callRow').classList.toggle('hidden', !calls || !to);
    $('#callScreen').classList.toggle('hidden', !to?.pc); // only PCs can share their screen
  }

  function onRtc(d) {
    calls?.handle(d.from, d.msg);
    const m = d.msg || {};
    if (m.type === 'ring') {
      const what = m.media === 'screen' ? (m.share === 'callee' ? 'wants to see your screen' : 'wants to show you their screen') : m.media === 'video' ? 'is video calling' : 'is calling';
      APP?.notify?.({ id: 'c-' + m.call, kind: 'call', title: `${d.from.name} ${what}`, body: 'Tap to answer' });
    } else if (m.type === 'end' || m.type === 'decline') APP?.clearNotify?.('c-' + m.call);
  }

  // ---------- don't lose the connection to an accidental Back press ----------
  // Keep an extra history entry: Back first closes the viewer, then asks for a second press.
  // In the app, the hardware Back button is handled natively (it sends the app to the background).
  window.dwBack = () => {
    if (!$('#viewer').classList.contains('hidden')) { closeViewer(); return true; }
    return false;
  };
  if (!APP) history.replaceState({ dw: 'base' }, '');
  if (!APP) history.pushState({ dw: 'guard' }, '');
  let lastBack = 0;
  if (!APP) window.addEventListener('popstate', () => {
    if (!$('#viewer').classList.contains('hidden')) { closeViewer(); history.pushState({ dw: 'guard' }, ''); return; }
    const now = Date.now();
    if (now - lastBack < 2000) { history.back(); return; } // second press within 2 s: really leave
    lastBack = now;
    history.pushState({ dw: 'guard' }, '');
    toast(uploads.size ? 'A transfer is running — press Back again to leave anyway' : 'Press Back again to leave DropWave');
  });
  // Closing the tab or reloading during an upload asks first.
  window.addEventListener('beforeunload', (e) => { if (uploads.size) { e.preventDefault(); e.returnValue = ''; } });

  // ---------- items shared into the app from other apps (Android "Share → DropWave") ----------
  let shared = null;
  window.dwShare = (files, text) => {
    shared = { files: files || [], text: text || '' };
    document.getElementById('share-card')?.remove();
    if (!shared.files.length && !shared.text) return;
    const n = shared.files.length;
    const what = [n ? `${n} file${n > 1 ? 's' : ''}` : '', shared.text ? 'a message' : ''].filter(Boolean).join(' and ');
    const card = el('div', 'offer', `
      <div style="font-weight:700;font-size:16px">Send ${what}</div>
      <div class="faint" style="font-size:13px;margin-top:2px">Pick a device under “Send to”, then tap Send.</div>
      ${shared.text ? `<div class="msg"></div>` : ''}
      <div class="row" style="gap:10px;margin-top:12px">
        <button class="btn ghost" data-x style="flex:1">Cancel</button>
        <button class="btn primary" data-go style="flex:2">Send</button>
      </div>`);
    card.id = 'share-card';
    if (shared.text) card.querySelector('.msg').textContent = shared.text;
    card.querySelector('[data-x]').onclick = () => { shared = null; card.remove(); };
    card.querySelector('[data-go]').onclick = async () => {
      const s = shared; shared = null; card.remove();
      if (s.text) { textIn.value = s.text; $('#textForm').requestSubmit(); }
      if (s.files.length) await send(s.files);
    };
    $('#offers').prepend(card);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
  if (APP?.sharedFiles?.length || APP?.sharedText) window.dwShare(APP.sharedFiles, APP.sharedText);
  // Coming back to the tab (phone was locked, app switched): reconnect if the link dropped.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && pc && (!es || es.readyState === 2)) connect();
  });
  window.addEventListener('online', () => { if (pc && (!es || es.readyState === 2)) connect(); });

  boot();
})();
</script>
</body>
</html>
