<!doctype html>
<!-- Phone mockups (light + dark) for the README. Render at 1200x900, scale 2. -->
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 1200px; height: 900px; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; gap: 70px;
    background: radial-gradient(600px 400px at 30% 20%, rgba(139,125,255,.22), transparent 60%),
                radial-gradient(600px 400px at 75% 85%, rgba(44,200,234,.18), transparent 60%), #0e1120; }
  .phone { position: relative; width: 380px; padding: 13px; border-radius: 58px; background: #05060a;
    box-shadow: 0 50px 90px -20px rgba(0,0,0,.8), 0 0 0 2px rgba(255,255,255,.14); }
  .phone img { display: block; width: 100%; height: 790px; object-fit: cover; object-position: top; border-radius: 46px; }
  .phone.tilt-l { transform: rotate(-4deg) translateY(10px); }
  .phone.tilt-r { transform: rotate(4deg) translateY(-10px); }
</style></head>
<body>
  <div class="phone tilt-l"><img src="../screenshots/phone-light.png" alt=""></div>
  <div class="phone tilt-r"><img src="../screenshots/phone-dark.png" alt=""></div>
</body></html>
